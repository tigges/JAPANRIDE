<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JAPANRIDE — Cycle Around Japan episode rides</title>
    <meta
      name="description"
      content="Unofficial map of NHK WORLD-JAPAN Cycle Around Japan episode rides: every hub, how to get from one to the next, and watch links to NHK when a segment is listed."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      setTimeout(function () {
        var root = document.getElementById("root");
        if (!root || root.childElementCount > 0) return;
        root.innerHTML =
          '<div style="font-family:Georgia,serif;max-width:36rem;margin:18vh auto;padding:0 1.5rem;color:#16130f">' +
          "<p style=\"letter-spacing:.18em;font-weight:600\">JAPANRIDE</p>" +
          '<p style="font-size:1.35rem;line-height:1.4;margin:.8rem 0 1.2rem">GitHub Pages is serving the unbuilt source, so this URL stays blank.</p>' +
          '<p style="font-family:sans-serif;font-size:.95rem;line-height:1.5;color:#6d6458">Open <a href="https://japanride.pages.dev/">japanride.pages.dev</a> for the live map. To fix this GitHub URL: Settings → Pages → Source → <strong>GitHub Actions</strong> (not Deploy from a branch).</p>' +
          "</div>";
      }, 2500);
    </script>
  </body>
</html>
